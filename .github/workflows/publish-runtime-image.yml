name: Publish Runtime Image

on:
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'release' &&
        github.event.action == 'created'
      )
    runs-on:
      - scriptorium-runtime-k8s
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: repository.arcadeya.com/whereareiam/scriptorium-docs-runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared runtime
        run: npm run build --workspace @scriptorium/site-runtime

      - name: Build deployable docs app
        run: npm run build:staged --workspace scriptorium-project-docs-template

      - name: Log in to registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login repository.arcadeya.com -u "$REGISTRY_USER" --password-stdin

      - name: Build image
        run: docker build -f templates/project-docs/Dockerfile -t "$IMAGE:dev-latest" templates/project-docs

      - name: Push image
        run: docker push "$IMAGE:dev-latest"
