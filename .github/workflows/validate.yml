name: Validate

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build shared runtime
        run: npm run build --workspace @scriptorium/site-runtime

      - name: Build deployable docs app
        env:
          SCRIPTORIUM_REPO_URL: https://github.com/whereareiam/Identica.git
          SCRIPTORIUM_DEFAULT_BRANCH: dev
          SCRIPTORIUM_REFRESH_INTERVAL_SECONDS: "900"
          SCRIPTORIUM_DATA_DIR: /tmp/scriptorium-runtime
        run: npm run build:staged --workspace scriptorium-project-docs-template
