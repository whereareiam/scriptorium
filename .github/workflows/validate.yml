name: Validate

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build deployable docs app
        env:
          SCRIPTORIUM_REPO_URL: https://github.com/whereareiam/Identica.git
          SCRIPTORIUM_DEFAULT_BRANCH: dev
          SCRIPTORIUM_DATA_DIR: /tmp/scriptorium-runtime
        run: bun run build
